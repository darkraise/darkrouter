<!doctype html>
<html lang="en" data-density="comfortable" data-radius="rounded" data-elevation="low" data-button-elevation="flat" data-surface-intensity="balanced" data-font-size="medium" data-background-style="solid" data-background-intensity="neutral" data-outer-glow="none" data-inner-glow="none" data-preset="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darkrouter</title>
    <!-- The .ico is declared with a size and the SVG without one, so a browser
         that understands both prefers the SVG and the legacy file is only ever
         a fallback. Both are served by the SPA handler, which lets any real
         file with an extension win before the index.html catch-all. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Restores the operator's theme axes before first paint. External
         rather than inline because the admin server's Content Security
         Policy allows scripts from this origin only. -->
    <script src="/theme-restore.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
