<!doctype html>
<html lang="en" data-density="comfortable" data-radius="rounded" data-elevation="low" data-button-elevation="flat" data-surface-intensity="balanced" data-font-size="medium" data-background-style="solid" data-background-intensity="neutral" data-outer-glow="none" data-inner-glow="none" data-preset="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darkrouter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        // Every axis the switcher offers is restored here, before first paint.
        // The static attributes on <html> are the shipped identity; anything
        // an operator has since changed lives in localStorage, and reading it
        // after React mounts means one frame of the old theme first.
        //
        // Keys mirror darkraise-ui's own (LS_* in its theme store). A key it
        // renames silently stops being restored, which shows up as a flash of
        // the default on reload rather than as an error.
        var root = document.documentElement

        var mode = localStorage.getItem("mode") || "system"
        root.setAttribute(
          "data-mode",
          mode === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : mode,
        )

        // Accent and surface colour are not attributes: the library computes
        // token values from them at runtime, so they cannot be pre-applied
        // here and are left to the provider.
        var axes = [
          ["theme-density", "data-density"],
          ["theme-radius", "data-radius"],
          ["theme-elevation", "data-elevation"],
          ["theme-button-elevation", "data-button-elevation"],
          ["theme-control-depth", "data-control-depth"],
          ["theme-surface-intensity", "data-surface-intensity"],
          ["theme-font-size", "data-font-size"],
          ["theme-bg-style", "data-background-style"],
          ["theme-bg-intensity", "data-background-intensity"],
          ["theme-gradient-pattern", "data-gradient-pattern"],
          ["theme-outer-glow", "data-outer-glow"],
          ["theme-inner-glow", "data-inner-glow"],
          ["theme-preset", "data-preset"],
        ]
        for (var i = 0; i < axes.length; i++) {
          var stored = localStorage.getItem(axes[i][0])
          if (stored) root.setAttribute(axes[i][1], stored)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
