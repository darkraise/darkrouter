<!doctype html>
<html lang="en" data-density="comfortable" data-radius="rounded" data-elevation="low" data-button-elevation="flat" data-surface-intensity="balanced" data-font-size="medium" data-background-style="solid" data-background-intensity="neutral" data-outer-glow="none" data-inner-glow="none" data-preset="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darkrouter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        // Only the two axes an operator can change need restoring here. The
        // rest are the identity and are stamped on <html> as static
        // attributes, so the first paint already has them and there is nothing
        // to mirror. The forty lines this replaces duplicated twelve
        // axis-to-storage mappings and a preset-neutralisation table that both
        // live in the library.
        var mode = localStorage.getItem("mode") || "system"
        var resolved =
          mode === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : mode
        document.documentElement.setAttribute("data-mode", resolved)

        var density = localStorage.getItem("theme-density")
        if (density) document.documentElement.setAttribute("data-density", density)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
