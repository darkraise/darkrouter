# Deployment stack for the published image. compose.yml is the dev stack and
# builds from source; this one only ever pulls, so what runs here is byte-for-byte
# what CI tested and pushed.
#
#   docker compose -f compose.prod.yml pull
#   docker compose -f compose.prod.yml up -d
#
# Expects, beside this file:
#   .env    the settings (.env.example is the template)
#   data/   a directory the container owns; it holds the database
#
# data/ needs nothing done to it. The container runs as root, so the directory
# Docker creates for the bind mount is writable as it stands -- with every
# capability dropped, the root filesystem read-only and no-new-privileges set,
# which is what makes running as uid 0 defensible. To run unprivileged instead,
# add  user: "10001:10001"  below and chown data/ to match.

services:
  darkrouter:
    image: darkraise/darkrouter:${DARKROUTER_TAG:-latest}
    container_name: darkrouter
    # Pin to an immutable sha tag when rolling back; latest has already moved by
    # then and would pull the thing being rolled back from.
    pull_policy: always
    restart: unless-stopped

    # Bound to every interface so the LAN can reach it directly. For the
    # internet, put your own reverse proxy in front — docs/operations/deploy.md
    # lists what it has to do — rather than forwarding these ports at the
    # router, which would publish the dashboard over plain HTTP.
    ports:
      - "${PROXY_PORT:-18080}:18080"
      - "${ADMIN_PORT:-18081}:18081"

    # Lets a model runtime on the host — Ollama, LM Studio, llama.cpp — be
    # reached from inside the container. Every local preset ships a localhost
    # base URL, and localhost here is this container, so without this name
    # there is no address the console's local-runtime form could offer.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Everything in .env reaches the container, so a variable a provider
    # expects resolves without editing this file — under any name, not a
    # fixed list. Raw means values are passed through verbatim: a bcrypt hash
    # is pasted as it was printed, and nothing needs a dollar sign escaped.
    env_file:
      - path: .env
        format: raw

    volumes:
      # Carries darkrouter.db and its WAL. The database holds encrypted
      # credentials, so this directory is as sensitive as .env.
      - ./data:/data
      # Where `auggie login` keeps its session. The Augment provider runs the
      # bundled CLI under the operator's own Augment account, and darkrouter
      # never sees that credential — so it lives here rather than in the
      # database, and without this volume every deploy would log it out.
      - auggie-state:/home/darkrouter/.augment

    # The process needs nothing beyond the two volumes: the binary is static,
    # the state lives under /data, and the Augment CLI keeps its session in
    # its own volume. Everything else is sealed. /tmp is a tmpfs because Go's
    # os.CreateTemp and the bundled Node runtime expect a writable one.
    read_only: true
    tmpfs:
      - /tmp
    # The server's own shutdown budget (config.ShutdownGrace, default 10s in
    # internal/config/load.go) plus its 500ms terminalGrace and final worker
    # flush (internal/server/server.go) can run right up against Compose's
    # 10s default, so a slow drain gets SIGKILLed mid-flush. Keep this at least
    # 5s above server.shutdown_grace, which is hot-reloadable from the console:
    # the gateway warns once shutdown_grace exceeds 25s, a threshold that
    # assumes this 30s value, so raise both together.
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A runaway request log or a fork bomb in a provider CLI stops here rather
    # than at the host's memory. The gateway itself idles well under 100 MB.
    mem_limit: 1g
    pids_limit: 512

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18081/readyz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    # An LXC container's disk is usually small, and request logging is chatty.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  auggie-state:
