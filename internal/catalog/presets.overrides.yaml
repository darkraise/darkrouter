# OmniRoute's registry records opencode as apikey, but its own provider
# constants file lists it among the no-auth providers, and so does the endpoint.
#
# The evidence is a completion rather than a listing — a public model list means
# nothing, which is what the g4f gateways were removed for. Verified 2026-08-29
# with no credential: big-pickle, mimo-v2.5-free, nemotron-3.5-lightning-free
# and hy3-free all answered 200; claude-fable-5 and the other premium ids 401.
#
# `optional` is exactly that shape: it answers without a credential on its free
# roster and answers more with one. An operator who wants only the models that
# work keyless can turn on "import free models only" when adding it.
opencode:
  auth:
    style: optional

# --- local runtimes -------------------------------------------------------
#
# A server the operator runs themselves, reached over the loopback interface.
# Every one of these speaks the OpenAI shape, so the kind is openaicompat and
# the only thing that distinguishes them is a port. None is in models.dev: the
# models are whatever the operator has pulled, which is exactly what discovery
# asking the endpoint will find.
#
# Ports are each project's documented default. An operator who moved one edits
# the base URL on the provider.

vllm:
