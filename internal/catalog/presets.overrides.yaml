# Hand-written: the generator drops the OmniRoute entry because its base URL is
# auggie://cli/stdio, and a non-http scheme is exactly what the drop rule is
# for. This one is not a mistranscription — internal/localcli serves the scheme
# by running the local CLI — so the entry is restored here rather than by
# weakening the rule for every other auggie://, devin:// and zcode:// entry the
# release has no transport for.
#
# optional rather than none: the CLI authenticates itself, so `auggie login`
# inside the container is one way to set it up and darkrouter holds nothing.
# The other is pasting the session document into the console, which is stored
# and rotated like any other credential and reaches the CLI as
# AUGMENT_SESSION_AUTH. Both work, which is exactly what optional means.
#
# The path suffix is /v1 so the openaicompat adapter builds
# auggie://cli/v1/chat/completions and auggie://cli/v1/models, which is what
# internal/localcli answers.
auggie:
  name: Augment (Auggie CLI)
  kind: openaicompat
  base_url: auggie://cli/v1
  auth:
    style: optional
  surfaces: [llm]
  no_models_dev: true
  website: https://augmentcode.com

