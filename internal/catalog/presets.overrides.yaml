# Hand-reviewed corrections merged over the generated presets on every
# presetgen run. A non-zero field here wins; an id absent from the generated
# set is added outright.

anthropic:
  litellm_id: anthropic
  models_dev_id: anthropic
  quirks: [requires-max-tokens]
  # models.dev lists "effort" among claude-opus-4-5's reasoning_options, but
  # phase 4 verified live on 2026-08-22 that thinking:{type:"adaptive"} is a
  # 400 on that model — output_config.effort and adaptive thinking are
  # different controls sharing a word. These rules are therefore declared
  # rather than derived. Longest match wins.
  #
  # The three refusal traits are declared from the API reference rather than
  # verified live: no_prefill on every 4.6-and-later family, and
  # thinking_always_on plus no_forced_tool_choice on the Fable and Mythos
  # lines. These rows are the operator's to correct when a family turns out to
  # accept a shape listed here as refused, or to refuse one that is not.
  model_traits:
    - {match: mythos-preview, adaptive: true, manual_budget: true, no_prefill: true, thinking_always_on: true, no_forced_tool_choice: true}
    - {match: opus-4-7, adaptive: true, no_prefill: true}
    - {match: opus-4-8, adaptive: true, no_prefill: true}
    - {match: opus-5, adaptive: true, no_prefill: true}
    - {match: sonnet-5, adaptive: true, no_prefill: true}
    - {match: fable-5, adaptive: true, no_prefill: true, thinking_always_on: true, no_forced_tool_choice: true}
    - {match: mythos-5, adaptive: true, no_prefill: true, thinking_always_on: true, no_forced_tool_choice: true}
    - {match: opus-4-6, adaptive: true, manual_budget: true, free_sampling: true, no_prefill: true}
    - {match: sonnet-4-6, adaptive: true, manual_budget: true, free_sampling: true, no_prefill: true}
    - {match: opus-4-5, manual_budget: true, free_sampling: true}
    - {match: sonnet-4-5, manual_budget: true, free_sampling: true}
    - {match: haiku-4-5, manual_budget: true, free_sampling: true}
    - {match: opus-4-1, manual_budget: true, free_sampling: true}
    - {match: opus-4, manual_budget: true, free_sampling: true}
    - {match: sonnet-4, manual_budget: true, free_sampling: true}
    - {match: claude-3, manual_budget: true, free_sampling: true}

