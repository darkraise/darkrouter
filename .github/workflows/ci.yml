name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# The image name is the only place the Docker Hub account appears. Everything
# else reads it from here.
env:
  IMAGE: darkraise/darkrouter

permissions:
  contents: read

# A push that lands while the previous run is still going supersedes it: the
# older commit's result would be discarded on merge anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # internal/admin/.gitignore keeps dist/* out of the repository, so a fresh
      # checkout carries only .gitkeep. go:embed still compiles against that, but
      # the SPA handler would serve an empty bundle and its tests would assert
      # against something the release image never ships. Building here makes the
      # Go tests run against the same asset the Dockerfile embeds.
      - name: Test and build the SPA
        working-directory: web
        run: |
          npm ci

          # Reports, but does not gate. The advisories endpoint is an external
          # service reached on every run, and when it is degraded it answers a
          # ~750-package bulk request with a timeout or a 503 -- which under
          # `bash -e` failed the step before a single test ran, so a registry
          # outage read as a broken build. Findings are raised as an annotation
          # so they stay visible in the run summary.
          #
          # The trade is deliberate: a genuine high-severity advisory no longer
          # stops a release, so it has to be caught by reading this warning.
          npm audit --audit-level=high \
            || echo "::warning title=npm audit::did not pass, or the advisories endpoint could not be reached -- see the step log"

          npm test
          npm run lint
          npm run build

      # gofmt prints the files it would change and exits 0 either way, so the
      # gate has to be on the output rather than the exit status.
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then
            echo "gofmt would reformat:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # CGO is what -race needs. ubuntu-latest ships gcc, so this only has to be
      # asked for rather than installed.
      - name: go test -race
        env:
          CGO_ENABLED: 1
        run: go test -race -cover -count=1 ./...

  # The next release number, derived from the conventional-commit subjects since
  # the last v-tag. It runs before the image so the version it derives can be
  # compiled into the binary and published as the image's semver tags in the
  # same build, rather than needing a second build once the tag exists.
  #
  # Only a push to master releases. A tag pushed by hand still builds an image
  # through the trigger above, and a workflow_dispatch run never releases, so a
  # manual re-run cannot mint a version by accident.
  version:
    name: next version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      major_minor: ${{ steps.next.outputs.major_minor }}
      tag: ${{ steps.next.outputs.tag }}
      previous: ${{ steps.next.outputs.previous }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      # The whole history and every tag: the bump is read from the commits since
      # the last release, so a shallow clone would see neither.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          fetch-depth: 0

      - id: next
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail

          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="$prev..HEAD"
            base=${prev#v}
            base=${base%%-*}
          else
            range=""
            base="0.0.0"
          fi
          IFS=. read -r major minor patch <<<"$base"

          subjects=$(git log --no-merges --format='%s' $range)
          bodies=$(git log --no-merges --format='%B' $range)

          # A piped `printf | grep -q` lets grep exit as soon as it finds its
          # match, which sends printf SIGPIPE once history is large enough to
          # fill the pipe buffer; under pipefail that failure makes the whole
          # `if` false even though the pattern was present. Here-strings feed
          # grep from a shell-buffered fd instead of a pipe, so there is
          # nothing upstream for grep to signal.
          bump=none
          if grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' <<<"$subjects" \
            || grep -qE '^BREAKING[ -]CHANGE:' <<<"$bodies"; then
            bump=major
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then
            bump=minor
          elif grep -qE '^(fix|perf|refactor|revert|build)(\([^)]*\))?:' <<<"$subjects"; then
            bump=patch
          fi

          # docs, style, test, chore and ci commits change nothing a user of the
          # image can observe, so a push carrying only those publishes no version.
          if [ "$bump" = none ]; then
            echo "No release-worthy commits since ${prev:-the start of history}; skipping the release."
            exit 0
          fi

          # Below 1.0.0 a breaking change bumps the minor rather than declaring
          # the API stable, which is what SemVer's 0.y.z clause allows and what
          # every release tool defaults to. Reaching 1.0.0 is a deliberate act:
          # tag it by hand once the interface is meant to be stable.
          case "$bump" in
            major)
              if [ "$major" -eq 0 ]; then minor=$((minor + 1)); patch=0
              else major=$((major + 1)); minor=0; patch=0; fi ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"

          # $3 inverts the match, which is how the last bucket catches every
          # subject the conventional-commit types above did not claim.
          section() {
            body=$(git log --no-merges --format='%s (%h)' $range | grep -E ${3:-} "$2" || true)
            [ -n "$body" ] || return 0
            printf '### %s\n\n' "$1"
            printf '%s\n' "$body" | sed 's/^/- /'
            printf '\n'
          }

          known='^(feat|fix|revert|perf|refactor|build|docs|style|test|chore|ci)(\([^)]*\))?!?:'
          {
            section 'Features' '^feat(\([^)]*\))?!?:'
            section 'Fixes' '^(fix|revert)(\([^)]*\))?!?:'
            section 'Other changes' '^(perf|refactor|build|docs|style|test|chore|ci)(\([^)]*\))?!?:'
            section 'Uncategorised' "$known" -v
            if [ -n "$prev" ]; then
              printf '**Full changelog**: %s/compare/%s...v%s\n' \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$prev" "$version"
            fi
          } > notes.md

          # notes.md is commit text, so its heredoc delimiter has to be one no
          # commit can contain. A fixed marker would let anyone who can land a
          # commit on master write a line matching it, close the heredoc early
          # and append output lines of their own -- a version, for one.
          delim="NOTES_EOF_$(openssl rand -hex 16)"
          if grep -qxF "$delim" notes.md; then
            echo "delimiter collision; refusing to write the release notes." >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "major_minor=$major.$minor"
            echo "tag=v$version"
            echo "previous=$prev"
            echo "notes<<$delim"
            cat notes.md
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

          echo "$bump bump: ${prev:-none} -> v$version"

  image:
    name: build and push image
    # A pull request builds nothing: it has no access to the registry secrets,
    # and pushing from an unmerged branch is what a tag is for.
    if: github.event_name != 'pull_request'
    needs: [test, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The only tag pushed by the build step below: an immutable sha tag
      # nothing pulls by name (compose.prod.yml tracks latest or a version
      # tag), so a scan failure after push just abandons this digest instead
      # of exposing it under a reachable tag.
      - id: candidate
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,format=short

      # latest, the semver tags and the major.minor tag -- computed now so the
      # build step can embed correct OCI labels, but not applied to the image
      # until the promotion step below runs, which only happens once Trivy
      # has passed.
      - id: release
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.version != '' }}
            type=raw,value=${{ needs.version.outputs.major_minor }},enable=${{ needs.version.outputs.version != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # linux/amd64 only: the deployment target is an LXC container on a Proxmox
      # host, which is x86_64. Adding linux/arm64 here means QEMU emulation for
      # the Go and npm stages and a much longer build, so it is left out until
      # something actually needs it.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          # The SBOM and the max-mode provenance attestation travel with the
          # image so a consumer can verify what went into it and from which
          # commit, without trusting the tag alone.
          sbom: true
          provenance: mode=max
          # The version the binary reports on /healthz, so a running container
          # can be matched to a build: the release this run is about to cut when
          # there is one, and otherwise metadata-action's derived version, which
          # is the semver for a hand-pushed v-tag and the branch name for a build
          # that publishes no release.
          # The Augment CLI's licence forbids redistribution, so the public
          # image is built without it. An operator who wants it builds
          # locally with WITH_AUGGIE=1, which is the Dockerfile's default.
          build-args: |
            VERSION=${{ needs.version.outputs.version || steps.release.outputs.version }}
            WITH_AUGGIE=0
          tags: ${{ steps.candidate.outputs.tags }}
          labels: ${{ steps.release.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan the candidate that was just pushed, by digest, so the report
      # describes the exact bytes the promotion step below would publish.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # Adds the release tags to the digest Trivy just cleared, rather than
      # rebuilding: imagetools copies the existing manifest list -- SBOM and
      # provenance attestations included -- so what is published under
      # latest/the version tags is byte-identical to what was scanned.
      - name: Promote the scanned image to its release tags
        if: steps.release.outputs.tags != ''
        env:
          TAGS: ${{ steps.release.outputs.tags }}
          SOURCE: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<<"$TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE"

  # The tag is created only after the image is in the registry, so a release
  # never points at a version nobody can pull. GITHUB_TOKEN pushes deliberately
  # do not re-trigger workflows, which is why the image job above had to publish
  # the semver tags itself rather than waiting for this push to come back round.
  release:
    name: tag and release
    needs: [version, image]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Both steps are idempotent, and separately so. A re-run of an already
      # released commit derives the same version and finds both already in
      # place; a run cancelled between the two finds the tag and still publishes
      # the release the first attempt did not reach.
      - name: Create the tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          # Commit subjects reach the shell through the environment rather than
          # through ${{ }} interpolation, which would splice them into the script.
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release for $TAG already exists."
            exit 0
          fi
          {
            printf '%s\n' "$NOTES"
            printf '### Image\n\n```\ndocker pull %s:%s\n```\n\nDigest: `%s`\n' \
              "$IMAGE" "$VERSION" "$DIGEST"
          } > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
