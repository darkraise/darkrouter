name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# The image name is the only place the Docker Hub account appears. Everything
# else reads it from here.
env:
  IMAGE: darkraise/darkrouter

permissions:
  contents: read

# A push that lands while the previous run is still going supersedes it: the
# older commit's result would be discarded on merge anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # internal/admin/.gitignore keeps dist/* out of the repository, so a fresh
      # checkout carries only .gitkeep. go:embed still compiles against that, but
      # the SPA handler would serve an empty bundle and its tests would assert
      # against something the release image never ships. Building here makes the
      # Go tests run against the same asset the Dockerfile embeds.
      - name: Test and build the SPA
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run lint
          npm run build

      # gofmt prints the files it would change and exits 0 either way, so the
      # gate has to be on the output rather than the exit status.
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then
            echo "gofmt would reformat:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # CGO is what -race needs. ubuntu-latest ships gcc, so this only has to be
      # asked for rather than installed.
      - name: go test -race
        env:
          CGO_ENABLED: 1
        run: go test -race -cover -count=1 ./...

  image:
    name: build and push image
    # A pull request builds nothing: it has no access to the registry secrets,
    # and pushing from an unmerged branch is what a tag is for.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest tracks master; a v-tag also publishes its own semver tags; and
          # every build gets an immutable sha tag, which is what a rollback pins
          # to when "latest" has already moved.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # linux/amd64 only: the deployment target is an LXC container on a Proxmox
      # host, which is x86_64. Adding linux/arm64 here means QEMU emulation for
      # the Go and npm stages and a much longer build, so it is left out until
      # something actually needs it.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # The SBOM and the max-mode provenance attestation travel with the
          # image so a consumer can verify what went into it and from which
          # commit, without trusting the tag alone.
          sbom: true
          provenance: mode=max
          # metadata-action's version output is the tag it derived: the semver
          # for a v-tag, the branch name otherwise. That is what the admin port's
          # /healthz reports, so a running container can be matched to a build.
          # The Augment CLI's licence forbids redistribution, so the public
          # image is built without it. An operator who wants it builds
          # locally with WITH_AUGGIE=1, which is the Dockerfile's default.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            WITH_AUGGIE=0
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan what was actually pushed, by digest, so the report describes the
      # bytes a deployment will pull rather than a local rebuild of them.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
