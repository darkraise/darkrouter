server:
  proxy_listen: :8080
  admin_listen: :8081
  # Optional. An unset variable means proxy authentication is off, which is why
  # this file loads on a machine that has never set it.
  proxy_token: ${DARKROUTER_PROXY_TOKEN}
  max_body_bytes: 33554432
  shutdown_grace: 30s
  sse:
    max_line_bytes: 1048576

providers:
  - id: groq
    kind: openaicompat
    base_url: https://api.groq.com/openai/v1
    api_key: ${GROQ_KEY}
    priority: 10
    models:
      - openai/gpt-oss-120b

# Aliases map a friendly name to an ordered fallback chain. Targets are
# provider/model or a bare model name.
aliases:
  fast:
    - groq/openai/gpt-oss-120b

policy:
  cooldown:
    trip_after: 3
    max: 15m
  retry:
    max_attempts: 4
  timeout:
    connect: 10s
    first_byte: 60s
    total: 10m
    idle: 120s

log:
  retention: 720h

capture:
  bodies: false
  max_bytes: 256000
  retention: 72h
