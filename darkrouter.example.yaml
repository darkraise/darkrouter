# Two environment variables live outside this file. DARKROUTER_MASTER_KEY
# unlocks the keyring stored credentials are encrypted with and is required.
# DARKROUTER_ADMIN_PASSWORD_HASH holds the bcrypt hash the dashboard logs in
# against — leaving it unset closes the dashboard rather than opening it, and
# `darkrouter hash-password` produces the value.

server:
  proxy_listen: :8080
  admin_listen: :8081
  # Optional. An unset variable means proxy authentication is off, which is why
  # this file loads on a machine that has never set it.
  proxy_token: ${DARKROUTER_PROXY_TOKEN}
  max_body_bytes: 33554432
  shutdown_grace: 30s
  sse:
    max_line_bytes: 1048576
    # How much of a streamed response one attempt may buffer before it is
    # committed to the client. Until the first token is committed a failure
    # still fails over; after it the client is already reading. The first_byte
    # timeout alone does not bound this, because a provider can emit megabytes
    # of preamble inside that window.
    max_precommit_bytes: 1048576

providers:
  - id: groq
    kind: openaicompat
    # preset connects this provider to its shipped metadata: pricing, model
    # capabilities, quirks, and the surfaces it serves. Omitting it leaves the
    # provider a base URL and a key, with none of those applied.
    preset: groq
    base_url: https://api.groq.com/openai/v1
    api_key: ${GROQ_KEY}
    priority: 10
    models:
      - openai/gpt-oss-120b

# Bedrock and Vertex cannot be configured in this file. They carry endpoint
# properties rather than a base URL and a key -- an AWS region and credential
# pair for Bedrock; a GCP project, location and service-account credential for
# Vertex -- and a provider entry here only knows id, kind, preset, base_url,
# api_key, priority and models. Add them from the console's Providers screen
# (or POST /api/providers), where those fields exist and the credential is
# stored encrypted. The vertex-anthropic preset selects the rawPredict route
# with the Anthropic payload.
#
# A Claude subscription is likewise connected from the console rather than
# configured here: there is no key to write down, only a flow to complete.

# Aliases and policy are imported into the database on the first run and edited
# through the admin API from then on, exactly as providers: already is. After
# that first start, changing either block here has no effect -- the dashboard
# and the API are where they live. The startup log records what was taken.
#
# Aliases map a friendly name to an ordered fallback chain. Targets are
# provider/model or a bare model name.
aliases:
  fast:
    - groq/openai/gpt-oss-120b

  # An embedding alias must list the SAME model across DIFFERENT providers.
  # Two models produce vectors in different vector spaces, so a failover to a
  # different model corrupts an index and nothing in the response says so.
  # embed:
  #   - openai/text-embedding-3-small
  #   - azure-openai/text-embedding-3-small

policy:
  cooldown:
    trip_after: 3
    max: 15m
  retry:
    max_attempts: 4
  timeout:
    connect: 10s
    first_byte: 60s
    total: 10m
    idle: 120s

log:
  retention: 720h

capture:
  bodies: false
  max_bytes: 256000
  retention: 72h

# Chat mode in the playground saves each conversation so it can be reopened
# tomorrow. This file is the only place to turn that off: the settings screen
# shows the key read-only, as it does every value the gateway reads from here.
# Turning it off stops new conversations being saved. It does not delete what
# is already stored -- the purge on the settings screen does that.
playground:
  save_conversations: true

# Media a client references by address rather than by value. Inlining means
# Darkrouter fetches it on the client's behalf, which is outbound traffic to
# an address the client chose; the fetcher constrains that but cannot make it
# risk-free. Absent means on.
media:
  inline: true

# Anthropic and Gemini providers use the same shape; only `kind` differs. Any
# inbound dialect can be served by any of them.
#
#  - id: anthropic
#    kind: anthropic
#    base_url: https://api.anthropic.com/v1
#    api_key: ${ANTHROPIC_KEY}
#    models: [claude-sonnet-4-5]
#
#  - id: gemini
#    kind: gemini
#    base_url: https://generativelanguage.googleapis.com/v1beta
#    api_key: ${GEMINI_KEY}
#    models: [gemini-2.0-flash]

# The model catalog. Both workers are optional: Darkrouter starts and serves
# with no outbound access to models.dev, falling back to the metadata snapshot
# embedded in the binary.
catalog:
  models_dev_url: https://models.dev/api.json
  sync_interval: 12h
  sync_timeout: 30s
  # The curated free-tier catalogue the "import free models only" filter reads.
  # Which models a provider's free tier covers cannot be derived from prices --
  # a free tier is a property of your account, not of the model -- so it is a
  # hand-maintained list, refreshed daily from the source below. Set
  # free_catalog_sync to false to keep the catalogue this release shipped with
  # and make no outbound request for it.
  free_catalog_sync: true
  free_catalog_url: https://raw.githubusercontent.com/diegosouzapw/OmniRoute/HEAD/open-sse/config/freeModelCatalog.data.ts
  free_catalog_interval: 24h
  # On first start, add a provider for every preset that needs no credential --
  # AI Horde, OpenCode Free, OVHcloud AI, UncloseAI -- so the gateway can route
  # something before anyone opens the console. Their models are imported with
  # the free-only filter above.
  #
  # Offered once, not on every start: delete one and it stays deleted. Setting
  # this to false stops future offers and removes nothing.
  seed_free_providers: true
  discovery:
    # Discovery probes each provider's model-listing endpoint. It is outbound
    # traffic the gateway initiates on your behalf; set false to disable it and
    # rely on presets and models.dev alone.
    enabled: true
    interval: 15m
    timeout: 15s
    # A cap across the whole fleet, not per provider.
    concurrency: 8
