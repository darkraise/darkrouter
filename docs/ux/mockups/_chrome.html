<!--
  Canonical console chrome. Copied verbatim into every screen fragment that
  depicts the operator console; only the topbar-title text and the
  data-active rail item change per screen. Kept outside fragments/ because it
  is a template, not a screen of its own — build.py only assembles
  fragments/*.html.
-->
<div class="chrome">

      <span class="rail-brand-text">
        <span class="rail-brand-name">darkrouter</span>
        <span class="rail-brand-version mono">v0.10.0</span>
      </span>
    </a>
    <div class="rail-group">
      <p class="legend-caps">Operate</p>
      <a class="rail-item" href="#" data-active="true"><svg class="rail-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="5.5" height="5.5" rx="1.5"/><rect x="10" y="2.5" width="5.5" height="5.5" rx="1.5"/><rect x="2.5" y="10" width="5.5" height="5.5" rx="1.5"/><rect x="10" y="10" width="5.5" height="5.5" rx="1.5"/></svg><span>Overview</span></a>
      <a class="rail-item" href="#"><svg class="rail-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.5h9.5M6 9h9.5M6 13.5h9.5"/><circle cx="3" cy="4.5" r="1"/><circle cx="3" cy="9" r="1"/><circle cx="3" cy="13.5" r="1"/></svg><span>Requests</span></a>

      <a class="rail-item" href="#"><svg class="rail-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5 16 6 9 9.5 2 6z"/><path d="M2 10 9 13.5 16 10"/></svg><span>Models</span></a>

    </div>
    <div class="rail-group">
      <p class="legend-caps">Use</p>
      <a class="rail-item" href="#"><svg class="rail-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3" width="13" height="12" rx="2"/><path d="M5.5 7.5 8 10l-2.5 2.5M10 12.5h4"/></svg><span>Playground</span></a>

    </div>
  </nav>
  <div class="chrome-main">
      <header class="topbar">
        <div class="topbar-heading">
          <h2 class="topbar-title">Overview</h2>
          <p class="topbar-route mono">operate/overview</p>
        </div>
        <div class="topbar-actions">
          <button class="topbar-btn" type="button"><svg class="topbar-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="6.75"/><path d="M2.25 9h13.5M9 2.25a10.5 10.5 0 0 1 0 13.5a10.5 10.5 0 0 1 0-13.5"/></svg><span>English</span><span class="topbar-caret">&#9662;</span></button>

        </div>
      </header>
    <main class="content">
      <!-- screen-specific content replaces this comment -->
    </main>
  </div>
</div>
