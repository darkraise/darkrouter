<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>darkrouter</title>
  <!--
    The same tile for Android's maskable slot, where the launcher may crop to
    any shape inside a circle of 80% diameter. The mark is at 37.5% rather than
    56% so it survives the worst crop with room to spare.
  -->
  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F19579"/>
      <stop offset="1" stop-color="#D24F32"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#coral)"/>
  <g stroke-width="1" fill-opacity="0.85" stroke-opacity="0.85">
    <g transform="translate(160 160) scale(8)">
      <rect x="2.5" y="2.5" width="19" height="19" fill="none" stroke="#fff"/>
      <rect x="11.5" y="2" width="1" height="3.5" fill="#fff"/>
      <rect x="11.5" y="8.5" width="1" height="7" fill="#fff"/>
      <rect x="11.5" y="18.5" width="1" height="3.5" fill="#fff"/>
      <rect x="2" y="6.5" width="10" height="1" fill="#fff"/>
      <rect x="2" y="11.5" width="17" height="1" fill="#fff"/>
      <rect x="2" y="16.5" width="10" height="1" fill="#fff"/>
      <rect x="11" y="6" width="2" height="2" fill="none" stroke="#fff"/>
      <rect x="11" y="16" width="2" height="2" fill="none" stroke="#fff"/>
      <rect x="18" y="10" width="4" height="4" fill="#fff" fill-opacity="1"/>
    </g>
  </g>
</svg>
