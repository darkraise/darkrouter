<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 137 24" width="137" height="24">
  <title>darkrouter</title>
  <!--
    §3.5's lockup: the mark, a 12px gap, then the name in Inter 600 lowercase
    at -0.01em. The name is set in Ink and never in the accent — the accent is
    a reading, and a product name is not a reading.

    The mark stays on its native 24-unit grid rather than being scaled up to
    meet a larger setting, so its hairlines stay on pixel boundaries wherever
    the lockup is rendered. The name is live text with a fallback stack rather
    than outlines, because this repository has no font tooling to convert it;
    where Inter is unavailable it sets in the reader's UI sans instead.
  -->
  <style>
    .hair { fill: #7B6C60; stroke: #7B6C60 }
    .ink  { fill: #1F1714 }
    @media (prefers-color-scheme: dark) {
      .hair { fill: #89786C; stroke: #89786C }
      .ink  { fill: #FAF8F5 }
    }
  </style>
  <g class="hair" shape-rendering="crispEdges">
    <rect x="2.5" y="2.5" width="19" height="19" fill="none" stroke-width="1"/>
    <rect x="11.5" y="2" width="1" height="3.5" stroke="none"/>
    <rect x="11.5" y="8.5" width="1" height="7" stroke="none"/>
    <rect x="11.5" y="18.5" width="1" height="3.5" stroke="none"/>
    <rect x="2" y="6.5" width="10" height="1" stroke="none"/>
    <rect x="2" y="11.5" width="17" height="1" stroke="none"/>
    <rect x="2" y="16.5" width="10" height="1" stroke="none"/>
    <rect x="11" y="6" width="2" height="2" fill="none" stroke-width="1"/>
    <rect x="11" y="16" width="2" height="2" fill="none" stroke-width="1"/>
  </g>
  <rect x="18" y="10" width="4" height="4" fill="#E56748" shape-rendering="crispEdges"/>
  <text class="ink" x="36" y="19.3" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-weight="600" font-size="20" letter-spacing="-0.2">darkrouter</text>
</svg>
