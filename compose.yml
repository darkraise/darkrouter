services:
  darkrouter:
    build: .
    image: darkrouter:dev
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      GROQ_KEY: ${GROQ_KEY}
      DARKROUTER_PROXY_TOKEN: ${DARKROUTER_PROXY_TOKEN:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/readyz"]
      interval: 30s
      timeout: 3s
      retries: 3
