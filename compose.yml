services:
  darkrouter:
    build: .
    image: darkrouter:dev
    ports:
      - "8080:8080"
      - "8081:8081"

    # Lets a model runtime on the host — Ollama, LM Studio, llama.cpp — be
    # reached from inside the container. Every local preset ships a localhost
    # base URL, and localhost here is this container, so without this name
    # there is no address the console's local-runtime form could offer.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GROQ_KEY: ${GROQ_KEY}
      DARKROUTER_PROXY_TOKEN: ${DARKROUTER_PROXY_TOKEN:-}
      DARKROUTER_LOG_FORMAT: ${DARKROUTER_LOG_FORMAT:-}
      DARKROUTER_LOG_LEVEL: ${DARKROUTER_LOG_LEVEL:-}
      # Required: it unlocks the keyring the stored credentials are encrypted
      # with, so the binary refuses to start without it.
      DARKROUTER_MASTER_KEY: ${DARKROUTER_MASTER_KEY}
      # Optional, and unsetting it closes the dashboard rather than opening it:
      # every login is refused. Produce a value with `darkrouter hash-password`.
      DARKROUTER_ADMIN_PASSWORD_HASH: ${DARKROUTER_ADMIN_PASSWORD_HASH:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/readyz"]
      interval: 30s
      timeout: 3s
      retries: 3
